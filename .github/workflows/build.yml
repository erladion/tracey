# Tests on every push and pull request; desktop installers (Linux AppImage, Windows
# installer) on main, on tags and by hand; a GitHub release with them for a tag v*.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Git identity for the tests that commit
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - run: npm run typecheck
      - run: npm test

  installers:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
            files: dist/*.AppImage
          - os: windows-latest
            target: --win
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A tag v1.2.3 makes version 1.2.3, whatever package.json says.
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npm run build
      - name: Installer
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l installers
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tracey ${GITHUB_REF_NAME#v}" \
            --generate-notes
