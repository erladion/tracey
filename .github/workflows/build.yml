# Tests on every push and pull request. For a tag v*: a draft GitHub release, the desktop
# installers (Linux AppImage, Windows installer) attached to it straight from the jobs
# that build them, then the release published. No artifacts, so releases use none of the
# account's Actions storage. Run by hand, the installers are artifacts kept for a day.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Git identity for the tests that commit
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - run: npm run typecheck
      - run: npm test

  # A tag's release, as a draft until both installers are on it. Already there (a re-run): kept.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
                 --title "Tracey ${GITHUB_REF_NAME#v}" --generate-notes

  installers:
    needs: [test, release]
    # The release job is skipped when run by hand: that's fine here.
    if: >-
      always() && needs.test.result == 'success' && needs.release.result != 'failure' && needs.release.result != 'cancelled'
      && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
            files: dist/*.AppImage
          - os: windows-latest
            target: --win
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A tag v1.2.3 makes version 1.2.3, whatever package.json says.
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npm run build
      # electron-builder downloads its tools while packaging; a server's hiccup (a 504)
      # shouldn't fail the release, so it gets three tries.
      - name: Installer
        shell: bash
        run: |
          for try in 1 2 3; do
            npx electron-builder ${{ matrix.target }} --publish never && exit 0
            echo "Packaging failed (try $try); trying again in 30 seconds."
            sleep 30
          done
          exit 1
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.files }} --clobber --repo "$GITHUB_REPOSITORY"
      - name: Keep as an artifact (run by hand)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 1

  # Both installers are on it: the release goes out.
  publish:
    needs: installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
